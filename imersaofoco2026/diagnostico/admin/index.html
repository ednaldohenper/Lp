<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="robots" content="noindex,nofollow">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0E0E10;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;

  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div id="load"><div class="sp"></div><p>Carregando o painel…</p></div>
  <iframe id="app"
    src="https://foco360-vault.vercel.app/9janelas/admin"
    title="Admin · Diagnóstico das 9 Janelas"
    allow="clipboard-write; clipboard-read; fullscreen; autoplay; camera; microphone; geolocation"

</html>
