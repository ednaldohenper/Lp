  function cartaoDados(d){ var it=answers["tempo"]; return { nome:d.nome, subtitulo:d.subtitulo, posicao:(POSICAO_TEMPO[it]!=null?POSICAO_TEMPO[it]:0.45), frase:FRASE_CARTAO[d.movimento] }; }

      perguntas:["Dos seus produtos atuais, qual você manteria se tivesse que cortar metade? E por que o resto está lá?","O produto novo resolve uma dor do seu cliente atual, ou vai buscar um cliente que você ainda não sabe atender?","Se o lançamento der certo, quem entrega? Se a resposta for você, o sucesso é o problema."],
      nota:"A Casa do Pão de Queijo está no Brasil e no mundo com 40 itens. Portfólio grande raramente é sinal de maturidade." },
    lideranca:{ reconhecimento:"É o movimento mais caro de errar. E pelo tempo que está parado, você já pagou um pedaço do custo de não fazer.",

      perguntas:["Quais decisões essa pessoa toma sem te consultar, e até que valor? Se você não consegue responder, não é hora de contratar — é hora de decidir isso.","O que você vai parar de olhar no dia em que ela entrar? Se a resposta é nada, você está contratando uma segunda opinião, não um líder.","Qual erro dela você aceita sem retomar o controle? Esse número define se a contratação funciona."] },
    preco:{ reconhecimento:"De todos os movimentos possíveis, é o de maior retorno e menor custo de execução. E o mais adiado que existe. Isso não é coincidência.",

    var done=false, to;
    function go(){ if(done) return; done=true; if(to) clearTimeout(to); avancar(); }
    to=setTimeout(go, reduce?Math.min(dur,1800):dur);
    if(!reduce){ var bar=n.querySelector('.devbar i'); if(bar){ bar.style.transition='width '+dur+'ms linear'; requestAnimationFrame(function(){ bar.style.width='100%'; }); } else { n.querySelector('.devbar').style.display='none'; } }
    else { n.querySelector('.devbar').style.display='none'; }

  function mascara(v){ v=(v||'').replace(/\D/g,'').slice(0,11);

  function montarDesafio(d){

      .catch(function(err){ console.error('[ALAVANCA] falhou',err&&err.message); });

  // ---------- cartao compartilhavel (canvas) ----------
  function wrapText(x,text,maxW,lh,yStart){
    var words=text.split(' '), line='', y=yStart, lines=[];
    for(var i=0;i<words.length;i++){ var t=line?line+' '+words[i]:words[i]; if(x.measureText(t).width>maxW && line){ lines.push(line); line=words[i]; } else line=t; }
    if(line) lines.push(line);
    lines.forEach(function(ln){ x.fillText(ln, 90, y); y+=lh; }); return y;
  }
  function gerarCartao(d,c){
    var W=1080,H=1350, cv=document.createElement('canvas'); cv.width=W; cv.height=H; var x=cv.getContext('2d');
    function draw(){
      x.fillStyle='#12202e'; x.fillRect(0,0,W,H);
      x.fillStyle='#e8792f'; x.font='700 30px Inter, sans-serif'; x.textBaseline='alphabetic';
      x.fillText('A  A L A V A N C A', 90, 150);
      x.fillStyle='#ffffff'; x.font='600 96px Fraunces, Georgia, serif';
      var yy=wrapText(x, c.nome, W-180, 104, 320);
      x.fillStyle='#aeb9c6'; x.font='400 34px Inter, sans-serif'; x.fillText(c.subtitulo, 90, yy+6);
      // travessia
      var ly=760, lx0=90, lx1=W-90; x.strokeStyle='#2b3a4b'; x.lineWidth=4; x.beginPath(); x.moveTo(lx0,ly); x.lineTo(lx1,ly); x.stroke();
      [0,0.5,1].forEach(function(t){ x.fillStyle='#2b3a4b'; x.beginPath(); x.arc(lx0+(lx1-lx0)*t, ly, 7, 0, 6.3); x.fill(); });
      var dx=lx0+(lx1-lx0)*c.posicao; x.fillStyle='#e8792f'; x.beginPath(); x.arc(dx,ly,18,0,6.3); x.fill();
      x.fillStyle='#8b97a5'; x.font='600 22px Inter, sans-serif';
      x.fillText('a decisão nasceu', lx0, ly+50); x.fillStyle='#e8792f'; x.textAlign='center'; x.fillText('você está aqui', (lx0+lx1)/2, ly+50);
      x.fillStyle='#8b97a5'; x.textAlign='right'; x.fillText('do outro lado', lx1, ly+50); x.textAlign='left';
      x.fillStyle='#ffffff'; x.font='500 46px Fraunces, Georgia, serif'; wrapText(x, c.frase, W-180, 58, 960);
      x.fillStyle='#8b97a5'; x.font='600 26px Inter, sans-serif'; x.fillText('ednaldohenper.com.br/quizz', 90, H-80);
      cv.toBlob(function(blob){
        try{ var file=new File([blob],'alavanca.png',{type:'image/png'});
          if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file],title:d.nome}).catch(function(){}); return; } }catch(e){}
        var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='alavanca-'+d.movimento+'.png'; document.body.appendChild(a); a.click(); a.remove();
      },'image/png');
    }
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(draw).catch(draw); setTimeout(draw,1200); }
    else draw();
  }

  renderIntro();
})();
</script>
